# XXL-JOB 调度中心 docker-compose 部署文件
# 镜像由 GitLab CI（.gitlab-ci.yml）构建后发布；也支持本地一键构建启动：
#   docker compose up -d --build      # 多阶段构建，本地无需安装 JDK/Maven
services:
  xxl-job-admin:
    # 镜像名可由 CI 传入；本地未指定时使用默认 tag
    image: ${XXL_JOB_ADMIN_IMAGE:-xxl-job-admin:latest}
    build:
      # 根目录 Dockerfile 为多阶段构建（Maven 在容器内打包）
      context: .
      dockerfile: Dockerfile
    container_name: xxl-job
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # 数据库连接：application-prod.yml 读取以下环境变量
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-tomori}
      - DB_DATABASE=${DB_DATABASE:-xxl_job}
      # Dockerfile 支持 JAVA_OPTS / LOG_HOME
      - JAVA_OPTS=-Xms256m -Xmx512m
      - LOG_HOME=/data/applogs
    ports:
      - "${SERVER_PORT:-8077}:8080"
    volumes:
      - xxl-job-logs:/data/applogs
    # 加入自定义网络
    networks:
      - dshiq04

volumes:
  xxl-job-logs:

# 加入自定义网络（需已存在：docker network create dshiq04）
networks:
  dshiq04:
    external: true
