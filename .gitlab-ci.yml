# =============================================================================
# XXL-JOB —— GitLab CI/CD（纯 docker 命令，不依赖 docker compose）
#
# 流程：docker build（多阶段构建，Maven 在镜像内打包）-> docker run 发布
#
# 前置条件：
#   - Runner 为 docker executor，且已挂载 /var/run/docker.sock：
#       [runners.docker]
#         image = "docker:27-cli"
#         privileged = false
#         volumes = ["/var/run/docker.sock:/var/run/docker.sock", "/cache"]
#   - 宿主机 docker 已配置 registry-mirrors（加速基础镜像拉取）
#   - 已存在的自定义网络（CI 会自动创建）
#
# 可在 GitLab CI/CD Variables 覆盖：
#   DB_HOST DB_PORT DB_USER DB_PASSWORD DB_DATABASE SERVER_PORT
#   DOCKER_NETWORK CONTAINER_NAME LOG_VOLUME JAVA_OPTS
# =============================================================================

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - build
  - deploy

variables:
  # 指向宿主机 Docker 守护进程（runner 挂载了 docker.sock）
  DOCKER_HOST: "unix:///var/run/docker.sock"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  # 镜像 / 容器 / 网络
  ADMIN_IMAGE: "xxl-job-admin"
  CONTAINER_NAME: "xxl-job"
  DOCKER_NETWORK: "dshiq04"
  LOG_VOLUME: "xxl-job-logs"
  # 端口：宿主机端口 -> 容器内端口
  SERVER_PORT: "8077"
  APP_PORT: "8080"
  # 健康检查用的临时容器
  CURL_IMAGE: "curlimages/curl:8.10.1"

default:
  interruptible: true

# ------------------------------------------------------------------ 构建镜像 --
build-image:
  stage: build
  image: docker:27-cli
  script:
    - docker version
    - docker build --pull -t "$ADMIN_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$ADMIN_IMAGE:latest" .
    - |
      docker image inspect "$ADMIN_IMAGE:$CI_COMMIT_SHORT_SHA" \
        --format '>>> 镜像构建完成 {{.Id}} size={{.Size}}'

# ------------------------------------------------------------------ 发布容器 --
deploy-admin:
  stage: deploy
  image: docker:27-cli
  needs:
    - job: build-image
  environment:
    name: local-docker
    url: "http://localhost:${SERVER_PORT}/xxl-job-admin"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: manual
      allow_failure: true
  script:
    # 0) 环境自检
    - |
      command -v docker >/dev/null 2>&1 || { echo "job 内没有 docker 命令：docker executor 需挂载 /var/run/docker.sock"; exit 1; }
      docker info >/dev/null 2>&1 || { echo "无法连接 Docker 守护进程"; exit 1; }
      docker image inspect "$ADMIN_IMAGE:latest" >/dev/null 2>&1 || docker build -t "$ADMIN_IMAGE:latest" .

    # 1) 网络（不存在则创建）
    - |
      if ! docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1; then
        echo ">>> 创建 docker 网络: $DOCKER_NETWORK"
        docker network create "$DOCKER_NETWORK" >/dev/null
      fi

    # 2) 备份当前版本镜像用于回滚
    - |
      docker image rm "$ADMIN_IMAGE:previous" >/dev/null 2>&1 || true
      if docker image inspect "$ADMIN_IMAGE:latest" >/dev/null 2>&1; then
        docker tag "$ADMIN_IMAGE:latest" "$ADMIN_IMAGE:previous"
        echo ">>> 已备份上一版本: $ADMIN_IMAGE:previous"
      fi

    # 3) 启动容器（函数封装，回滚时复用同一套参数）
    - |
      start_app() {
        docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
        docker run -d --name "$CONTAINER_NAME" \
          --restart unless-stopped \
          --network "$DOCKER_NETWORK" \
          -e TZ=Asia/Shanghai \
          -e DB_HOST="${DB_HOST:-postgres}" \
          -e DB_PORT="${DB_PORT:-5432}" \
          -e DB_USER="${DB_USER:-postgres}" \
          -e DB_PASSWORD="${DB_PASSWORD:-tomori}" \
          -e DB_DATABASE="${DB_DATABASE:-xxl_job}" \
          -e JAVA_OPTS="${JAVA_OPTS:--Xms256m -Xmx512m}" \
          -e LOG_HOME=/data/applogs \
          -p "${SERVER_PORT:-8077}:${APP_PORT:-8080}" \
          -v "${LOG_VOLUME}:/data/applogs" \
          "$1" >/dev/null
        echo ">>> 容器已启动: $CONTAINER_NAME 镜像=$1 端口=${SERVER_PORT:-8077}"
      }

      start_app "$ADMIN_IMAGE:latest"
